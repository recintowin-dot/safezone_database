<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Safe Zone - Places</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 20px; }
    ul { list-style: none; padding: 0; }
    li { padding: 8px 12px; border-bottom: 1px solid #ddd; }
    .name { font-weight: 600; }
    .meta { color: #555; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>Places</h1>
  <div id="content">
    <ul id="places"></ul>
  </div>

  <script>
    async function loadPlaces() {
      try {
        const res = await fetch('/api/places?limit=100');
        if (!res.ok) {
          document.getElementById('content').innerText = 'Error loading places';
          return;
        }
        const places = await res.json();
        const ul = document.getElementById('places');
        ul.innerHTML = '';
        if (!Array.isArray(places) || places.length === 0) {
          ul.innerHTML = '<li>No places found</li>';
          return;
        }
        for (const p of places) {
          const li = document.createElement('li');
          li.innerHTML = `
            <div class="name">${escapeHtml(p.name)}</div>
            <div class="meta">${p.latitude.toFixed(6)}, ${p.longitude.toFixed(6)} — ${escapeHtml(p.address)}</div>
          `;
          ul.appendChild(li);
        }
      } catch (err) {
        document.getElementById('content').innerText = 'Error loading places';
      }
    }

    function escapeHtml(s) {
      if (!s) return '';
      return s.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;');
    }

    document.addEventListener('DOMContentLoaded', loadPlaces);
  </script>
</body>
</html>
