<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Zone Database</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        .places-list {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        .places-list h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .place-item {
            background: #f9f9f9;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .place-item h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .place-info {
            color: #666;
            font-size: 0.95em;
            margin-bottom: 5px;
        }

        .place-info strong {
            color: #667eea;
        }

        .place-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .place-actions button {
            flex: 1;
            padding: 8px;
            font-size: 0.9em;
        }

        .btn-delete {
            background: #e74c3c;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .btn-edit {
            background: #f39c12;
        }

        .btn-edit:hover {
            background: #e67e22;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .empty-state p {
            font-size: 1.1em;
        }

        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .modal-content h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: black;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 Safe Zone Database</h1>
            <p>Manage your places - name, coordinates, and address</p>
        </header>

        <div class="content">
            <div class="card">
                <h2>Add New Place</h2>
                <div id="message" class="message"></div>
                <form id="placeForm">
                    <div class="form-group">
                        <label for="placeName">Place Name *</label>
                        <input type="text" id="placeName" name="name" required placeholder="e.g., Central Park">
                    </div>
                    <div class="form-group">
                        <label for="latitude">Latitude *</label>
                        <input type="number" id="latitude" name="latitude" step="0.000001" required placeholder="e.g., 40.785091">
                    </div>
                    <div class="form-group">
                        <label for="longitude">Longitude *</label>
                        <input type="number" id="longitude" name="longitude" step="0.000001" required placeholder="e.g., -73.968285">
                    </div>
                    <div class="form-group">
                        <label for="address">Address *</label>
                        <textarea id="address" name="address" required placeholder="e.g., New York, NY" rows="3"></textarea>
                    </div>
                    <button type="submit">Add Place</button>
                </form>
            </div>

            <div class="card">
                <h2>Quick Stats</h2>
                <div style="margin-top: 20px;">
                    <div class="place-info" style="margin-bottom: 20px;">
                        <strong style="display: block; font-size: 2em; color: #667eea;">
                            <span id="placeCount">0</span>
                        </strong>
                        <span>Total Places</span>
                    </div>
                    <div style="background: #f0f0f0; padding: 15px; border-radius: 5px; color: #666;">
                        <p style="margin-bottom: 10px;">📍 API Endpoints Available:</p>
                        <ul style="margin-left: 20px; line-height: 1.8;">
                            <li>POST /api/places</li>
                            <li>GET /api/places</li>
                            <li>GET /api/places/{id}</li>
                            <li>PUT /api/places/{id}</li>
                            <li>DELETE /api/places/{id}</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <div class="places-list">
            <h2>All Places</h2>
            <div id="placesList"></div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeEditModal()">&times;</span>
            <h2>Edit Place</h2>
            <form id="editForm">
                <input type="hidden" id="editPlaceId">
                <div class="form-group">
                    <label for="editPlaceName">Place Name</label>
                    <input type="text" id="editPlaceName" name="name" placeholder="Place name">
                </div>
                <div class="form-group">
                    <label for="editLatitude">Latitude</label>
                    <input type="number" id="editLatitude" name="latitude" step="0.000001" placeholder="Latitude">
                </div>
                <div class="form-group">
                    <label for="editLongitude">Longitude</label>
                    <input type="number" id="editLongitude" name="longitude" step="0.000001" placeholder="Longitude">
                </div>
                <div class="form-group">
                    <label for="editAddress">Address</label>
                    <textarea id="editAddress" name="address" placeholder="Address" rows="3"></textarea>
                </div>
                <button type="submit">Save Changes</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        // Load places on page load
        document.addEventListener('DOMContentLoaded', loadPlaces);

        // Form submission
        document.getElementById('placeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const place = {
                name: document.getElementById('placeName').value,
                latitude: parseFloat(document.getElementById('latitude').value),
                longitude: parseFloat(document.getElementById('longitude').value),
                address: document.getElementById('address').value
            };

            try {
                const response = await fetch(`${API_URL}/places`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(place)
                });

                if (response.ok) {
                    showMessage('Place added successfully!', 'success');
                    document.getElementById('placeForm').reset();
                    loadPlaces();
                } else {
                    showMessage('Error adding place', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        });

        // Edit form submission
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('editPlaceId').value;
            const place = {
                name: document.getElementById('editPlaceName').value || undefined,
                latitude: document.getElementById('editLatitude').value ? parseFloat(document.getElementById('editLatitude').value) : undefined,
                longitude: document.getElementById('editLongitude').value ? parseFloat(document.getElementById('editLongitude').value) : undefined,
                address: document.getElementById('editAddress').value || undefined
            };

            // Remove undefined values
            Object.keys(place).forEach(key => place[key] === undefined && delete place[key]);

            try {
                const response = await fetch(`${API_URL}/places/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(place)
                });

                if (response.ok) {
                    showMessage('Place updated successfully!', 'success');
                    closeEditModal();
                    loadPlaces();
                } else {
                    showMessage('Error updating place', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        });

        async function loadPlaces() {
            try {
                const response = await fetch(`${API_URL}/places?limit=100`);
                const places = await response.json();

                const placesList = document.getElementById('placesList');
                document.getElementById('placeCount').textContent = places.length;

                if (places.length === 0) {
                    placesList.innerHTML = '<div class="empty-state"><p>No places yet. Add one to get started!</p></div>';
                    return;
                }

                placesList.innerHTML = places.map(place => `
                    <div class="place-item">
                        <h3>${escapeHtml(place.name)}</h3>
                        <div class="place-info">
                            <strong>📍 Coordinates:</strong> ${place.latitude.toFixed(6)}, ${place.longitude.toFixed(6)}
                        </div>
                        <div class="place-info">
                            <strong>🏠 Address:</strong> ${escapeHtml(place.address)}
                        </div>
                        <div class="place-info" style="font-size: 0.85em; color: #999; margin-top: 10px;">
                            <strong>Created:</strong> ${new Date(place.created_at).toLocaleString()}
                        </div>
                        <div class="place-actions">
                            <button class="btn-edit" onclick="openEditModal(${place.id}, '${escapeHtml(place.name)}', ${place.latitude}, ${place.longitude}, '${escapeHtml(place.address)}')">Edit</button>
                            <button class="btn-delete" onclick="deletePlace(${place.id})">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading places:', error);
                document.getElementById('placesList').innerHTML = '<div class="empty-state"><p>Error loading places</p></div>';
            }
        }

        async function deletePlace(id) {
            if (!confirm('Are you sure you want to delete this place?')) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/places/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showMessage('Place deleted successfully!', 'success');
                    loadPlaces();
                } else {
                    showMessage('Error deleting place', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        function openEditModal(id, name, latitude, longitude, address) {
            document.getElementById('editPlaceId').value = id;
            document.getElementById('editPlaceName').value = name;
            document.getElementById('editLatitude').value = latitude;
            document.getElementById('editLongitude').value = longitude;
            document.getElementById('editAddress').value = address;
            document.getElementById('editModal').style.display = 'block';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
            document.getElementById('editForm').reset();
        }

        function showMessage(message, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = message;
            messageEl.className = `message ${type}`;
            
            setTimeout(() => {
                messageEl.className = 'message';
            }, 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('editModal');
            if (event.target === modal) {
                closeEditModal();
            }
        }

        // Refresh places every 5 seconds
        setInterval(loadPlaces, 5000);
    </script>
</body>
</html>
